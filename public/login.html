<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in - SpendWise</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body>
  <main class="page">
    <p class="brand">SpendWise</p>

    <section class="card">
      <h1>Log in</h1>
      <p id="message" class="message" role="status" hidden></p>

      <form id="login-form" class="auth-form">
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" maxlength="254" required>
        </div>
        <div>
          <label for="password">Password</label>
          <div class="password-field">
            <input type="password" id="password" name="password" autocomplete="current-password" maxlength="72" required>
            <button type="button" class="button button-secondary" data-toggle-password="password" aria-label="Show password">Show</button>
          </div>
        </div>
        <button type="submit" class="button">Log in</button>
      </form>

      <p>New here? <a href="/register.html">Create an account</a></p>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
