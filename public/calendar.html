<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Calendar - SpendWise</title>
<link href="/css/base.css" rel="stylesheet"/>
<link href="/css/layout.css" rel="stylesheet"/>
<script src="/js/theme.js"></script>
<link href="/css/refinement.css" rel="stylesheet"/>
<link href="/css/pages.css" rel="stylesheet"/></head>
<body class="app-layout page-calendar">
<header class="sidebar" id="sidebar"></header>
<header class="app-topbar"><div class="app-page-title"><strong>Calendar</strong><small>Your month, day by day</small></div><div class="topbar-actions"><a class="button" href="/daily.html">+ Quick Add</a></div></header><main class="content">

<p class="message" hidden="" id="message" role="status"></p>
<div class="calendar-columns"><section class="card">
<div class="page-header">
<h2 id="calendar-title">...</h2>
<div class="form-actions">
<button class="button button-secondary" id="previous-month" type="button">Previous</button>
<button class="button button-secondary" id="current-month" type="button">Today</button>
<button class="button button-secondary" id="next-month" type="button">Next</button>
</div>
</div>
<div aria-hidden="true" class="calendar-weekdays">
<span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
</div>
<div class="calendar" id="calendar"></div>
<p class="muted legend" id="legend"></p>
</section><div class="calendar-side"><section class="card selected-day"><h2 class="section-title" id="selected-title">...</h2><div class="summary-grid">
<section class="card">
<p class="summary-label">Income</p>
<p class="summary-value" id="day-income">...</p>
</section>
<section class="card">
<p class="summary-label">Expenses</p>
<p class="summary-value" id="day-expense">...</p>
</section>
<section class="card">
<p class="summary-label">Net cash flow</p>
<p class="summary-value" id="day-net">...</p>
</section>
</div><a class="button calendar-add-link" href="#calendar-add">+ Add transaction</a></section><section class="card">
<h2>Transactions</h2>
<div id="day-transactions"></div>
</section><section class="card">
<h2>Journal</h2>
<p class="message" hidden="" id="journal-message" role="status"></p>
<form id="journal-form">
<label for="journal-content">Your reflection (private)</label>
<textarea disabled="" id="journal-content" maxlength="5000" required="" rows="3"></textarea>
<div class="form-actions">
<button class="button" disabled="" id="journal-save" type="submit">Save entry</button>
<button class="button button-danger" hidden="" id="journal-delete" type="button">Delete entry</button>
</div>
</form>
</section></div></div>



<section class="card" id="calendar-add">
<h2>Add a transaction for this day</h2>
<p class="message" hidden="" id="add-message" role="status"></p>
<form class="form-grid" id="add-form"></form>
</section>
<section class="card">
<h2>Previous journal entries</h2>
<ul class="plain-list" id="journal-list"></ul>
<div class="pagination" hidden="" id="journal-pagination">
<button class="button button-secondary" id="journal-newer" type="button">Newer</button>
<span class="muted" id="journal-page"></span>
<button class="button button-secondary" id="journal-older" type="button">Older</button>
</div>
</section>
<dialog id="edit-dialog">
<h2>Edit transaction</h2>
<p class="message" hidden="" id="edit-message" role="status"></p>
<form class="form-grid" id="edit-form"></form>
</dialog>
</main>
<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script src="/js/transaction-form.js"></script>
<script src="/js/calendar.js"></script>
<script src="/js/journal.js"></script>
</body>
</html>
