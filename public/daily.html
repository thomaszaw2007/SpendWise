<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily entry - SpendWise</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body class="app-layout">
  <header class="sidebar" id="sidebar"></header>

  <main class="content">
    <div class="page-header">
      <h1>Daily entry</h1>
      <div>
        <label for="day">Showing date</label>
        <input type="date" id="day" min="2000-01-01">
      </div>
    </div>
    <p id="message" class="message" role="status" hidden></p>

    <div class="summary-grid">
      <section class="card">
        <p class="summary-label">Income for the day</p>
        <p class="summary-value" id="day-income">...</p>
      </section>
      <section class="card">
        <p class="summary-label">Expenses for the day</p>
        <p class="summary-value" id="day-expense">...</p>
      </section>
      <section class="card">
        <p class="summary-label">Net cash flow</p>
        <p class="summary-value" id="day-net">...</p>
      </section>
    </div>

    <section class="card">
      <h2>Add a transaction</h2>
      <p id="add-message" class="message" role="status" hidden></p>
      <form id="add-form" class="form-grid"></form>
    </section>

    <section class="card">
      <div class="page-header">
        <h2>Transactions on this day</h2>
        <a id="journal-link" href="/calendar.html">Open journal for this day</a>
      </div>
      <div id="day-transactions"></div>
    </section>

    <dialog id="edit-dialog">
      <h2>Edit transaction</h2>
      <p id="edit-message" class="message" role="status" hidden></p>
      <form id="edit-form" class="form-grid"></form>
    </dialog>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/transaction-form.js"></script>
  <script src="/js/daily.js"></script>
</body>
</html>
