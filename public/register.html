<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account - SpendWise</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body>
  <main class="page">
    <p class="brand">SpendWise</p>

    <section class="card">
      <h1>Create account</h1>
      <p id="message" class="message" role="status" hidden></p>

      <form id="register-form" class="auth-form">
        <div>
          <label for="fullName">Full name</label>
          <input type="text" id="fullName" name="fullName" autocomplete="name" maxlength="100" required>
        </div>
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" maxlength="254" required>
        </div>
        <div>
          <label for="password">Password (at least 8 characters)</label>
          <div class="password-field">
            <input type="password" id="password" name="password" autocomplete="new-password" maxlength="72" required minlength="8">
            <button type="button" class="button button-secondary" data-toggle-password="password" aria-label="Show password">Show</button>
          </div>
        </div>
        <div>
          <label for="confirmPassword">Confirm password</label>
          <div class="password-field">
            <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" maxlength="72" required>
            <button type="button" class="button button-secondary" data-toggle-password="confirmPassword" aria-label="Show confirm password">Show</button>
          </div>
        </div>
        <button type="submit" class="button">Create account</button>
      </form>

      <p>Already registered? <a href="/login.html">Log in</a></p>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
