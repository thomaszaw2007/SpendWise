<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Budgets - SpendWise</title>
<link href="/css/base.css" rel="stylesheet"/>
<link href="/css/layout.css" rel="stylesheet"/>
<script src="/js/theme.js"></script>
<link href="/css/refinement.css" rel="stylesheet"/>
<link href="/css/pages.css" rel="stylesheet"/></head>
<body class="app-layout page-budgets">
<header class="sidebar" id="sidebar"></header>
<header class="app-topbar"><div class="app-page-title"><strong>Budgets</strong><small>Plan, then keep the plan</small></div><div class="topbar-actions"><a class="button" href="/daily.html">+ Quick Add</a></div></header><main class="content">
<div class="page-header">
<div><h1>Budgets</h1><p class="page-subtitle">Set spending limits that work for you.</p></div>
<div class="picker">
<div>
<label for="month">Month</label>
<select id="month"></select>
</div>
<div>
<label for="year">Year</label>
<select id="year"></select>
</div>
</div>
</div>
<p class="muted">Only expenses count. Budgets never block a transaction and do not roll over.</p>
<p class="message" hidden="" id="message" role="status"></p>
<div class="budget-top"><section class="card">
<h2 id="monthly-title">Monthly budget</h2>
<div id="monthly-budget"></div>
</section><section class="card">
<h2>Daily spending limit</h2>
<p class="muted">One limit for every day. The progress shows today.</p>
<div id="daily-budget"></div>
</section></div>

<section class="category-budget-section">
<h2 id="category-title">Category budgets</h2>
<form class="form-grid card" id="category-budget-form">
<div>
<label for="category">Expense category</label>
<select id="category" name="categoryId" required=""></select>
</div>
<div>
<label for="category-amount">Budget (SGD)</label>
<input id="category-amount" inputmode="decimal" name="amount" placeholder="0.00" required=""/>
</div>
<div class="full-width">
<button class="button" type="submit">Add category budget</button>
</div>
</form>
<div id="category-budgets"></div>
</section>
</main>
<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script src="/js/budgets.js"></script>
</body>
</html>
