<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Categories - SpendWise</title>
<link href="/css/base.css" rel="stylesheet"/>
<link href="/css/layout.css" rel="stylesheet"/>
<script src="/js/theme.js"></script>
<link href="/css/refinement.css" rel="stylesheet"/>
<link href="/css/pages.css" rel="stylesheet"/></head>
<body class="app-layout page-categories">
<header class="sidebar" id="sidebar"></header>
<header class="app-topbar"><div class="app-page-title"><strong>Categories</strong><small>Organise where money goes</small></div><div class="topbar-actions"><a class="button" href="/daily.html">+ Quick Add</a></div></header><main class="content">
<h1>Category library</h1><p class="page-subtitle">Organise your income and expenses.</p>
<p class="muted">Archived categories are hidden from new transactions. Past transactions keep them.</p>
<p class="message" hidden="" id="message" role="status"></p>
<section class="card">
<h2>Add a category</h2>
<form class="form-grid" id="category-form">
<div>
<label for="name">Name</label>
<input id="name" maxlength="50" name="name" required="" type="text"/>
</div>
<div>
<label for="type">Type</label>
<select id="type" name="type">
<option value="expense">Expense</option>
<option value="income">Income</option>
</select>
</div>
<div><label for="category-color">Colour</label><input type="color" id="category-color" name="color" value="#0d9165" class="category-color-picker"/></div>
<div class="full-width">
<button class="button" type="submit">Add category</button>
</div>
</form>
</section>
<div class="category-sections">
<section class="card">
<h2>Expense categories</h2>
<ul class="category-list" id="expense-categories"></ul>
</section>
<section class="card">
<h2>Income categories</h2>
<ul class="category-list" id="income-categories"></ul>
</section>
</div>
</main>
<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script src="/js/categories.js"></script>
</body>
</html>
